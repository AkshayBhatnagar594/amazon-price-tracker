name: Test reachability (temporary)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check camelcamelcamel + keepa reachability
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"

          test_url () {
            local label="$1" url="$2" outfile="$3"
            code=$(curl -s -L -o "$outfile" -w "%{http_code}" -A "$UA" "$url" || echo "FAIL")
            snippet=$(head -c 600 "$outfile" 2>/dev/null | tr -d '\000' | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')
            echo "  \"$label\": {\"url\": \"$url\", \"http_code\": \"$code\", \"snippet\": $snippet},"
          }

          {
            echo "{"
            test_url "camelcamelcamel_home" "https://camelcamelcamel.com/" /tmp/home.html
            test_url "camelcamelcamel_our_item" "https://camelcamelcamel.com/product/B0CYZFHWMY" /tmp/p1.html
            test_url "camelcamelcamel_popular_item" "https://camelcamelcamel.com/product/B00FLYWNYQ" /tmp/p2.html
            code=$(curl -s -L -o /tmp/keepa.html -w "%{http_code}" -A "$UA" "https://keepa.com/" || echo "FAIL")
            echo "  \"keepa_home\": {\"url\": \"https://keepa.com/\", \"http_code\": \"$code\"}"
            echo "}"
          } > data/reachability_test.json

          cat data/reachability_test.json

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reachability_test.json
          git diff --cached --quiet || git commit -m "Reachability test results"
          git push
