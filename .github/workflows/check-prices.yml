name: Check prices

on:
  schedule:
    # Polls hourly, but scripts/check_prices.py only actually runs a check
    # once "check_interval_hours" worth of time has passed since the last
    # one (see products.json) - so the real interval is controlled there,
    # not here. GitHub Actions cron runs in UTC.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check prices
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          FORCE_CHECK: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/check_prices.py

      - name: Commit updated price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/latest.json data/last_run.json data/alert_state.json products.json
          git diff --cached --quiet || git commit -m "Update price history [skip ci]"
          git push
