name: Remove product

on:
  workflow_dispatch:
    inputs:
      product_link:
        description: "Amazon product or wishlist link to stop tracking"
        required: true
        type: string

permissions:
  contents: write

jobs:
  remove-product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove from products.json
        id: remove
        env:
          PRODUCT_LINK: ${{ github.event.inputs.product_link }}
        run: python3 scripts/remove_product.py

      - name: Commit updated products.json
        if: steps.remove.outputs.status == 'ok'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json data/latest.json
          git diff --cached --quiet || git commit -m "Remove ${{ steps.remove.outputs.name }} (purchased)"
          git push

      - name: Write run summary
        run: |
          if [ "${{ steps.remove.outputs.status }}" = "ok" ]; then
            echo "✅ ${{ steps.remove.outputs.message }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ ${{ steps.remove.outputs.message }}" >> "$GITHUB_STEP_SUMMARY"
          fi
