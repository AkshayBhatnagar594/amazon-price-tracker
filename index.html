<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amazon Price Tracker</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --row-hover: #f9fafb;
    --link: #1a5fb4;
    --pill-down-bg: #dcfce7;
    --pill-down-fg: #166534;
    --pill-up-bg: #fee2e2;
    --pill-up-fg: #991b1b;
    --accent: #1a5fb4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #eaeaea;
      --muted: #9aa0a6;
      --border: #2a2d33;
      --row-hover: #1c1f24;
      --link: #7cb0ff;
      --pill-down-bg: #103820;
      --pill-down-fg: #6adf9a;
      --pill-up-bg: #3a1414;
      --pill-up-fg: #ff9b9b;
      --accent: #7cb0ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1.25rem 4rem;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin: 0 0 1.5rem; }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    margin-bottom: 1.25rem;
  }
  .add-link {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    padding: 0.55rem 1rem;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
  }
  .add-link:hover { opacity: 0.9; }
  #updated { color: var(--muted); font-size: 0.85rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  thead th {
    text-align: left;
    padding: 0.6rem 0.75rem;
    border-bottom: 2px solid var(--border);
    color: var(--muted);
    font-weight: 600;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  tbody td {
    padding: 0.75rem;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tbody tr:hover { background: var(--row-hover); }
  .name { font-weight: 500; }
  .price { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pending { color: var(--muted); font-style: italic; }
  .checked { color: var(--muted); white-space: nowrap; font-size: 0.85rem; }
  .buy-link {
    color: var(--link);
    text-decoration: none;
    font-weight: 600;
    white-space: nowrap;
  }
  .buy-link:hover { text-decoration: underline; }
  .empty {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--muted);
  }
  .error {
    background: var(--pill-up-bg);
    color: var(--pill-up-fg);
    padding: 0.75rem 1rem;
    border-radius: 8px;
    margin-bottom: 1rem;
    font-size: 0.9rem;
  }
  @media (max-width: 640px) {
    .checked { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Amazon Price Tracker</h1>
  <p class="subtitle">Live view of everything currently being tracked. Updates automatically every 6 hours.</p>

  <div class="toolbar">
    <a class="add-link" id="add-link" href="#" target="_blank" rel="noopener">+ Add a product to track</a>
    <span id="updated"></span>
  </div>

  <div id="error-box"></div>
  <div id="content">Loading…</div>
</div>

<script>
  // Update these if the repo is ever renamed/forked.
  const OWNER = "AkshayBhatnagar594";
  const REPO = "amazon-price-tracker";

  document.getElementById("add-link").href =
    `https://github.com/${OWNER}/${REPO}/issues/new?template=add-product.yml`;

  function fmtPrice(price) {
    if (price === null || price === undefined) return null;
    return "$" + Number(price).toFixed(2);
  }

  function fmtRelative(iso) {
    if (!iso) return "never";
    const then = new Date(iso);
    const diffMs = Date.now() - then.getTime();
    const mins = Math.round(diffMs / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return `${mins}m ago`;
    const hours = Math.round(mins / 60);
    if (hours < 48) return `${hours}h ago`;
    const days = Math.round(hours / 24);
    return `${days}d ago`;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  async function fetchJson(path, fallback) {
    try {
      const res = await fetch(path + "?_=" + Date.now());
      if (!res.ok) return fallback;
      return await res.json();
    } catch (e) {
      return fallback;
    }
  }

  async function load() {
    const [products, latest] = await Promise.all([
      fetchJson("./products.json", { products: [], wishlists: [] }),
      fetchJson("./data/latest.json", {}),
    ]);

    // Merge: start from products.json (may not have a price yet),
    // then overlay/extend with data/latest.json (has real prices, and
    // includes items discovered via wishlists that aren't individually
    // listed in products.json).
    const rows = new Map();

    for (const p of (products.products || [])) {
      const url = typeof p === "string" ? p : p.url;
      const name = typeof p === "string" ? url : (p.name || url);
      rows.set(url, { url, name, price: null, last_checked: null });
    }

    for (const [url, info] of Object.entries(latest || {})) {
      rows.set(url, {
        url,
        name: info.name || url,
        price: info.price,
        last_checked: info.last_checked,
      });
    }

    renderTable(Array.from(rows.values()));
  }

  function renderTable(items) {
    const content = document.getElementById("content");
    const updated = document.getElementById("updated");

    if (items.length === 0) {
      content.innerHTML = `<div class="empty">No items tracked yet. Click "+ Add a product to track" above to get started.</div>`;
      return;
    }

    items.sort((a, b) => a.name.localeCompare(b.name));

    let mostRecent = null;
    for (const item of items) {
      if (item.last_checked && (!mostRecent || item.last_checked > mostRecent)) {
        mostRecent = item.last_checked;
      }
    }
    updated.textContent = mostRecent ? `Last check: ${fmtRelative(mostRecent)}` : "";

    const rowsHtml = items.map(item => {
      const priceStr = fmtPrice(item.price);
      const priceCell = priceStr
        ? `<span class="price">${priceStr}</span>`
        : `<span class="price pending">not checked yet</span>`;
      return `
        <tr>
          <td class="name">${escapeHtml(item.name)}</td>
          <td>${priceCell}</td>
          <td class="checked">${item.last_checked ? fmtRelative(item.last_checked) : "—"}</td>
          <td><a class="buy-link" href="${escapeHtml(item.url)}" target="_blank" rel="noopener">View on Amazon →</a></td>
        </tr>`;
    }).join("");

    content.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Item</th>
            <th>Price</th>
            <th class="checked">Checked</th>
            <th>Link</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>`;
  }

  load().catch(err => {
    document.getElementById("error-box").innerHTML =
      `<div class="error">Couldn't load tracker data: ${escapeHtml(String(err))}</div>`;
    document.getElementById("content").innerHTML = "";
  });

  // Keep the page fresh if left open.
  setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
